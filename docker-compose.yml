services:
  source-db:
    image: postgres:16.4
    command: [postgres, -c, wal_level=logical]
    environment:
      POSTGRES_USER: ${SOURCE_DB_USER:-bank_user}
      POSTGRES_PASSWORD: ${SOURCE_DB_PASSWORD:-change_me}
      POSTGRES_DB: ${SOURCE_DB_NAME:-bank_source}
    ports:
      - "127.0.0.1:${SOURCE_DB_HOST_PORT:-5434}:5432"
    volumes:
      - source_db_data:/var/lib/postgresql/data
      - ./infra/postgres/init/01_schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 5s
      retries: 20

  airflow:
    build: .
    env_file: ${ENV_FILE:-.env}
    environment:
      SOURCE_DB_HOST: source-db
      SOURCE_DB_HOST_PORT: 5432
      AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
      AIRFLOW__CORE__EXECUTOR: SequentialExecutor
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: 'true'
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: sqlite:////opt/airflow/state/airflow.db
      AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY:-}
    command:
      - bash
      - -ec
      - |
        airflow db migrate
        airflow users create --username "$$AIRFLOW_ADMIN_USER" --password "$$AIRFLOW_ADMIN_PASSWORD" --firstname Local --lastname Student --role Admin --email student@example.com || true
        exec airflow standalone
    ports:
      - "127.0.0.1:${AIRFLOW_HOST_PORT:-8086}:8080"
    depends_on:
      source-db:
        condition: service_healthy
    volumes:
      - airflow_state:/opt/airflow/state
      - airflow_logs:/opt/airflow/logs
      - pipeline_data:/opt/airflow/data
    healthcheck:
      test: [CMD-SHELL, 'curl --fail http://localhost:8080/health']
      interval: 10s
      timeout: 5s
      retries: 40
      start_period: 30s

volumes:
  source_db_data:
  airflow_state:
  airflow_logs:
  pipeline_data:
