name: checks
on: [pull_request, push]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install ruff==0.11.13
      - run: ruff check jobs worker scripts orchestration tests infra/superset
      - run: ruff format --check jobs worker scripts orchestration tests infra/superset
      - run: python -m compileall -q jobs worker scripts orchestration tests infra/superset
      - run: bash -n scripts/smoke.sh worker/entrypoint.sh infra/kafka/init-topics.sh infra/airflow/start.sh
      - run: docker compose --env-file .env.example config --quiet
      - run: python -m unittest discover -s tests/unit -v
